[package]
name = "m3ua"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "M3UA (MTP3 User Adaptation Layer) codec and SG-side ASP state machine per RFC 4666"
authors = ["Real Time Telecom B.V."]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Real-Time-Telecom-B-V/m3ua"
