# Maturin build config for the `m3ua` wheel. The version is single-sourced from
# Cargo.toml (`dynamic = ["version"]`), so PyPI and crates.io always ship the same
# number. `extension-module` is the ONLY place that feature is enabled — never by
# `cargo test`/`cargo clippy` (it un-links libpython and breaks Rust test binaries).
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "m3ua"
description = "Rust-backed M3UA (RFC 4666) codec for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Real Time Telecom B.V." }]
keywords = ["m3ua", "ss7", "sigtran", "mtp3", "telecom"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Communications",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Real-Time-Telecom-B-V/m3ua"
Repository = "https://github.com/Real-Time-Telecom-B-V/m3ua"

[tool.maturin]
# Mixed layout: compiled ext at `m3ua._m3ua`, pure-Python shim under python/.
module-name = "m3ua._m3ua"
python-source = "python"
features = ["extension-module"]
